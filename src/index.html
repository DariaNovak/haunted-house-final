<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покинута садиба</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas class="webgl"></canvas>

    <div class="intro">
        <h1>Покинута садиба</h1>
        <p>Будинок, сарай, вбиральня, цвинтар, паркан і привиди, що блукають у тумані.</p>
        <p class="intro-progress">Завантаження текстур… <span class="intro-percent">0%</span></p>
        <div class="intro-buttons">
            <button class="intro-enter" data-sound="on" disabled>Увійти зі звуком</button>
            <button class="intro-enter intro-secondary" data-sound="off" disabled>Без звуку</button>
        </div>
        <p class="intro-hint">Миша: обертання / зум. Праворуч — панель налаштувань.</p>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
